[package]
name = "pet"
version = "0.1.0"
description = "A standalone desktop pet app with local commands"
authors = ["ty-toolbox"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tiny_http = "0.12"
